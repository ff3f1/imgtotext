# Memory and encoding settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Mandatory for Jetpack Compose and AndroidX dependencies
android.useAndroidX=true

# Disable configuration cache to prevent Gradle 9.4.1 serialization crashes
org.gradle.configuration-cache=false

# Kotlin code style
kotlin.code.style=official
